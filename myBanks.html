<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Bank Links</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .bank-button {
      display: block;
      margin: 10px 0;
      padding: 12px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
    }
    .bank-button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h1>My Bank Logins</h1>
  
  <button class="bank-button" onclick="window.open('https://www.onlinesbi.sbi//')">SBI Bank India</button>
  <button class="bank-button" onclick="window.open('https://internet-banking.dbs.com.sg/IB/Welcome/')">DBS SG</button>
  <button class="bank-button" onclick="window.open('https://us.etrade.com/etx/pxy/login')">ETRADE Marvell Stocks</button>
  <button class="bank-button" onclick="window.open('https://netbanking.hdfcbank.com/netbanking//')">HDFC NRE</button>
  <button class="bank-button" onclick="window.open('https://www.tigerbrokers.com.sg/login/')">Tiger Brokers Stocks</button>
  <button class="bank-button" onclick="window.open('https://pruaccess.prudential.com.sg/pruaccess_sg/login.jsp')">Prudential Funds</button>

</body>
</html>
